<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Borewell Water</title>
<style>
:root{
  --bg:#0d1b2a;--card:#132337;--card2:#1a2f45;--border:#1e3a55;
  --accent:#2196f3;--green:#00c875;--warn:#ffb300;--red:#f44336;
  --text:#e8f4fd;--text2:#7a9bb5;--text3:#3d607a;
  --tab-h:60px;--top-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top-h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
.topbar-title{font-size:16px;font-weight:600}
.topbar-sub{font-size:11px;color:var(--text2);margin-top:1px}
.topbar-badge{font-size:11px;background:rgba(0,200,117,0.15);color:var(--green);padding:4px 10px;border-radius:20px;border:1px solid rgba(0,200,117,0.25)}

/* PAGES */
.pages{position:fixed;top:var(--top-h);bottom:var(--tab-h);left:0;right:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:none;animation:up .2s ease}
.page.active{display:block}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* BOTTOM TABS */
.tabs{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--text2);font-size:10px;cursor:pointer;padding:0;transition:color .15s}
.tab svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab.active svg{stroke:var(--accent)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* METRICS */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.m-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.m-val{font-size:22px;font-weight:700;line-height:1}
.m-sub{font-size:10px;color:var(--text2);margin-top:4px}

/* FORM */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field select option{background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;color:var(--text2);margin-bottom:12px;min-height:38px;line-height:1.6}

/* BUTTONS */
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-blue{background:var(--accent);color:#fff}
.btn-green{background:rgba(0,200,117,.15);color:var(--green);border:1px solid rgba(0,200,117,.3)}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);margin-top:8px}
.btn + .btn{margin-top:8px}

/* BADGES */
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.b-ok{background:rgba(0,200,117,.12);color:var(--green);border:1px solid rgba(0,200,117,.2)}
.b-warn{background:rgba(255,179,0,.12);color:var(--warn);border:1px solid rgba(255,179,0,.2)}
.b-blue{background:rgba(33,150,243,.12);color:var(--accent);border:1px solid rgba(33,150,243,.2)}

/* LIST ROWS */
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.rn{font-size:13px;font-weight:500}
.rs{font-size:11px;color:var(--text2);margin-top:2px}
.rv{font-size:13px;font-weight:600;text-align:right}

/* TABLE */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:360px}
th{text-align:left;padding:8px 8px;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg);font-weight:500}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;border-top:1px solid var(--border);border-bottom:none;padding-top:10px}

/* AVATAR */
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1565c0,var(--accent));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}

/* BAR */
.bar{height:5px;background:var(--bg);border-radius:10px;overflow:hidden;margin-top:4px}
.bar-f{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent),#64b5f6)}

/* EMPTY */
.empty{padding:40px 0;text-align:center;color:var(--text3);font-size:13px}
.empty svg{width:36px;height:36px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px;display:block;margin:0 auto 8px}

/* LEDGER SUMMARY */
.lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px;background:var(--bg);border-radius:10px;padding:12px}
.lsi{text-align:center}
.lsi-l{font-size:10px;color:var(--text2);text-transform:uppercase;margin-bottom:3px}
.lsi-v{font-size:15px;font-weight:700}

/* RECEIPT */
.rcpt{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.rrow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.rrow:last-child{border-bottom:none}
.rtot{font-weight:700;font-size:15px}

/* TOAST */
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">💧 Borewell Water</div>
    <div class="topbar-sub" id="topbar-sub">Loading...</div>
  </div>
  <div class="topbar-badge" id="sync-badge">● Live</div>
</div>

<div class="pages">

  <!-- DASHBOARD -->
  <div class="page active" id="p-dashboard">
    <div class="metrics" id="metrics"></div>
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Pending Dues
      </div>
      <div id="due-list"><div class="empty"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>All cleared!</div></div>
    </div>
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Recent Sessions
      </div>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- SESSIONS -->
  <div class="page" id="p-sessions">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Add Session
      </div>
      <div class="field"><label>Date</label><input type="date" id="s-date"/></div>
      <div class="field"><label>Farmer Name</label><input type="text" id="s-name" placeholder="Type or select" list="fdl" autocomplete="off"/><datalist id="fdl"></datalist></div>
      <div class="row2">
        <div class="field"><label>Start Time</label><input type="time" id="s-start"/></div>
        <div class="field"><label>End Time</label><input type="time" id="s-end"/></div>
      </div>
      <div class="row2">
        <div class="field"><label>Rate (Rs/hr)</label><input type="number" id="s-rate" value="150" min="1"/></div>
        <div class="field"><label>Paid Now (Rs)</label><input type="number" id="s-paid" value="0" min="0"/></div>
      </div>
      <div class="preview" id="s-preview">Enter start and end time to see bill</div>
      <button class="btn btn-blue" id="btn-save-session">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Session
      </button>
    </div>
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        All Sessions
      </div>
      <div id="session-list"><div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>No sessions yet</div></div>
    </div>
  </div>

  <!-- FARMERS -->
  <div class="page" id="p-farmers">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Farmer Register
      </div>
      <div id="farmer-list"><div class="empty"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>No farmers yet</div></div>
    </div>
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Record Payment
      </div>
      <div class="field"><label>Farmer</label><select id="p-farmer"><option value="">Select farmer</option></select></div>
      <div id="p-info" style="font-size:12px;color:var(--text2);margin-bottom:10px;min-height:16px"></div>
      <div class="field"><label>Amount Received (Rs)</label><input type="number" id="p-amt" min="1" placeholder="0"/></div>
      <button class="btn btn-green" id="btn-pay">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Record Payment
      </button>
    </div>
  </div>

  <!-- LEDGER -->
  <div class="page" id="p-ledger">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Farmer Ledger
      </div>
      <div class="field">
        <label>Select Farmer</label>
        <select id="l-farmer"><option value="">-- Choose farmer --</option></select>
      </div>
      <div id="ledger-body"><div class="empty"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Select a farmer above</div></div>
    </div>
  </div>

  <!-- RECEIPT -->
  <div class="page" id="p-receipt">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Generate Receipt
      </div>
      <div class="field"><label>Farmer</label><select id="r-farmer"><option value="">Select farmer</option></select></div>
      <div class="field"><label>Business Name</label><input type="text" id="r-biz" value="Borewell Farm Water Services"/></div>
      <button class="btn btn-blue" id="btn-rcpt">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview Receipt
      </button>
    </div>
    <div id="rcpt-out"></div>
    <button class="btn btn-ghost" id="btn-print" style="display:none;margin-bottom:16px">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / Save PDF
    </button>
  </div>

</div><!-- /pages -->

<!-- BOTTOM TABS -->
<nav class="tabs">
  <button class="tab active" data-page="dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Dashboard
  </button>
  <button class="tab" data-page="sessions">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Sessions
  </button>
  <button class="tab" data-page="farmers">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    Farmers
  </button>
  <button class="tab" data-page="ledger">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    Ledger
  </button>
  <button class="tab" data-page="receipt">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Receipt
  </button>
</nav>

<div id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────
var db = { sessions: [], nextId: 1 };
try { var _s = localStorage.getItem('bw'); if(_s) db = JSON.parse(_s); } catch(e){}
function save(){ try{ localStorage.setItem('bw', JSON.stringify(db)); }catch(e){} }

function farmers(){
  var m = {};
  db.sessions.forEach(function(s){
    if(!m[s.farmer]) m[s.farmer]={name:s.farmer,hrs:0,bill:0,paid:0,bal:0,n:0};
    m[s.farmer].hrs+=s.hrs; m[s.farmer].bill+=s.bill;
    m[s.farmer].paid+=s.paid; m[s.farmer].bal+=s.bal; m[s.farmer].n++;
  });
  return Object.values(m);
}
function rs(n){ return 'Rs '+Math.round(n).toLocaleString('en-IN'); }
function hh(n){ return (Math.round(n*10)/10)+' hr'; }

// ── NAVIGATION ────────────────────────────────────
var currentPage = 'dashboard';
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    var pg = this.getAttribute('data-page');
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
    document.getElementById('p-'+pg).classList.add('active');
    this.classList.add('active');
    currentPage = pg;
    if(pg==='dashboard') renderDash();
    if(pg==='sessions')  renderSessions();
    if(pg==='farmers')   renderFarmers();
    if(pg==='ledger')    initLedger();
    if(pg==='receipt')   initReceipt();
  });
});

// ── TOPBAR SUB ────────────────────────────────────
function updateTopbar(){
  var f = farmers();
  var due = f.filter(function(x){return x.bal>0;}).length;
  document.getElementById('topbar-sub').textContent =
    f.length + ' farmers · ' + db.sessions.length + ' sessions' + (due>0?' · '+due+' dues':'');
}

// ── DASHBOARD ─────────────────────────────────────
function renderDash(){
  var f = farmers();
  var tB = f.reduce(function(a,c){return a+c.bill;},0);
  var tP = f.reduce(function(a,c){return a+c.paid;},0);
  var tD = f.filter(function(x){return x.bal>0;}).reduce(function(a,c){return a+c.bal;},0);
  var tH = f.reduce(function(a,c){return a+c.hrs;},0);

  document.getElementById('metrics').innerHTML =
    '<div class="metric"><div class="m-label">Total Billed</div><div class="m-val">'+rs(tB)+'</div><div class="m-sub">'+db.sessions.length+' sessions</div></div>'+
    '<div class="metric"><div class="m-label">Collected</div><div class="m-val" style="color:var(--green)">'+rs(tP)+'</div><div class="m-sub">'+(tB>0?Math.round(tP/tB*100):0)+'% done</div></div>'+
    '<div class="metric"><div class="m-label">Pending</div><div class="m-val" style="color:var(--warn)">'+rs(tD)+'</div><div class="m-sub">'+f.filter(function(x){return x.bal>0;}).length+' farmers</div></div>'+
    '<div class="metric"><div class="m-label">Hours</div><div class="m-val">'+Math.round(tH)+'</div><div class="m-sub">hrs pumped</div></div>';

  var dues = f.filter(function(x){return x.bal>0;}).sort(function(a,b){return b.bal-a.bal;});
  if(!dues.length){
    document.getElementById('due-list').innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" style="stroke:var(--green)"><polyline points="20 6 9 17 4 12"/></svg>All cleared!</div>';
  } else {
    document.getElementById('due-list').innerHTML = dues.map(function(d){
      return '<div class="row"><div><div class="rn">'+d.name+'</div><div class="rs">'+d.n+' session(s) · '+hh(d.hrs)+'</div></div><span class="badge b-warn">'+rs(d.bal)+'</span></div>';
    }).join('');
  }

  var rec = db.sessions.slice().sort(function(a,b){return b.id-a.id;}).slice(0,6);
  document.getElementById('recent-list').innerHTML = rec.length ? rec.map(function(s){
    return '<div class="row"><div><div class="rn">'+s.farmer+'</div><div class="rs">'+s.date+' · '+s.start+'-'+s.end+'</div></div><div class="rv"><div>'+rs(s.bill)+'</div><span class="badge '+(s.bal<=0?'b-ok':'b-warn')+'" style="font-size:10px">'+(s.bal<=0?'Paid':'Rs '+Math.round(s.bal)+' due')+'</span></div></div>';
  }).join('') : '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>No sessions yet</div>';
  updateTopbar();
}

// ── SESSIONS ──────────────────────────────────────
function renderSessions(){
  var names = []; db.sessions.forEach(function(s){if(names.indexOf(s.farmer)===-1)names.push(s.farmer);});
  document.getElementById('fdl').innerHTML = names.map(function(n){return '<option value="'+n+'">';}).join('');
  if(!document.getElementById('s-date').value) document.getElementById('s-date').value = new Date().toISOString().split('T')[0];
  var list = db.sessions.slice().sort(function(a,b){return b.id-a.id;});
  document.getElementById('session-list').innerHTML = list.length ? list.map(function(s){
    return '<div class="row"><div><div class="rn">'+s.farmer+'</div><div class="rs">'+s.date+' · '+s.start+'-'+s.end+' · '+hh(s.hrs)+'</div></div><div class="rv"><div>'+rs(s.bill)+'</div><span class="badge '+(s.bal<=0?'b-ok':'b-warn')+'" style="font-size:10px">'+(s.bal<=0?'Paid':'Rs '+Math.round(s.bal)+' due')+'</span></div></div>';
  }).join('') : '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>No sessions yet</div>';
}

function calcPreview(){
  var st=document.getElementById('s-start').value, en=document.getElementById('s-end').value;
  var rate=parseFloat(document.getElementById('s-rate').value)||150;
  var paid=parseFloat(document.getElementById('s-paid').value)||0;
  var name=document.getElementById('s-name').value||'Farmer';
  var el=document.getElementById('s-preview');
  if(!st||!en){el.textContent='Enter start and end time to see bill';return;}
  var sm=st.split(':'),em=en.split(':');
  var hrs=(+em[0]*60+ +em[1]- +sm[0]*60- +sm[1])/60;
  if(hrs<=0){el.textContent='End must be after start';return;}
  var bill=Math.round(hrs*rate), bal=Math.round(bill-paid);
  el.innerHTML = '<strong>'+name+'</strong> · '+Math.round(hrs*10)/10+' hrs · Bill: '+rs(bill)+' · Paid: '+rs(paid)+' · <span style="color:'+(bal>0?'var(--warn)':'var(--green)')+'">Balance: '+rs(bal)+'</span>';
}
['s-start','s-end','s-rate','s-paid','s-name'].forEach(function(id){
  document.getElementById(id).addEventListener('input', calcPreview);
});

document.getElementById('btn-save-session').addEventListener('click', function(){
  var date=document.getElementById('s-date').value;
  var farmer=document.getElementById('s-name').value.trim();
  var st=document.getElementById('s-start').value, en=document.getElementById('s-end').value;
  var rate=parseFloat(document.getElementById('s-rate').value)||150;
  var paid=parseFloat(document.getElementById('s-paid').value)||0;
  if(!date||!farmer||!st||!en){toast('Fill all fields');return;}
  var sm=st.split(':'),em=en.split(':');
  var hrs=(+em[0]*60+ +em[1]- +sm[0]*60- +sm[1])/60;
  if(hrs<=0){toast('End must be after start');return;}
  var bill=Math.round(hrs*rate), bal=Math.round(bill-paid);
  db.sessions.push({id:db.nextId++,date:date,farmer:farmer,start:st,end:en,rate:rate,hrs:Math.round(hrs*100)/100,bill:bill,paid:paid,bal:bal});
  save(); toast('Session saved!');
  document.getElementById('s-name').value=''; document.getElementById('s-start').value=''; document.getElementById('s-end').value=''; document.getElementById('s-paid').value='0';
  document.getElementById('s-preview').textContent='Enter start and end time to see bill';
  renderSessions();
});

// ── FARMERS ───────────────────────────────────────
function renderFarmers(){
  var f = farmers();
  document.getElementById('farmer-list').innerHTML = f.length ? f.map(function(d){
    var init=d.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    return '<div class="row"><div style="display:flex;align-items:center;gap:10px"><div class="av">'+init+'</div><div><div class="rn">'+d.name+'</div><div class="rs">'+d.n+' sessions · '+hh(d.hrs)+'</div></div></div><div style="text-align:right"><div style="font-size:12px">'+rs(d.bill)+'</div><span class="badge '+(d.bal<=0?'b-ok':'b-warn')+'" style="font-size:10px;margin-top:3px">'+(d.bal<=0?'Paid':'Rs '+Math.round(d.bal)+' due')+'</span></div></div>';
  }).join('') : '<div class="empty"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>No farmers yet</div>';

  var pf=document.getElementById('p-farmer'), cur=pf.value;
  pf.innerHTML='<option value="">Select farmer</option>'+f.map(function(d){return '<option value="'+d.name+'"'+(d.name===cur?' selected':'')+'>'+d.name+'</option>';}).join('');
  if(cur) updatePayInfo();
}

function updatePayInfo(){
  var name=document.getElementById('p-farmer').value;
  var amt=parseFloat(document.getElementById('p-amt').value)||0;
  var el=document.getElementById('p-info');
  if(!name){el.textContent='';return;}
  var f=farmers().find(function(x){return x.name===name;});
  if(!f){el.textContent='';return;}
  var nb=Math.round(f.bal-amt);
  el.innerHTML='Balance: <span style="color:'+(f.bal>0?'var(--warn)':'var(--green)')+'">'+rs(f.bal)+'</span>'+(amt>0?' → After: <span style="color:'+(nb<=0?'var(--green)':'var(--warn)')+'">'+rs(nb)+'</span>':'');
}
document.getElementById('p-farmer').addEventListener('change', updatePayInfo);
document.getElementById('p-amt').addEventListener('input', updatePayInfo);

document.getElementById('btn-pay').addEventListener('click', function(){
  var name=document.getElementById('p-farmer').value;
  var amt=parseFloat(document.getElementById('p-amt').value)||0;
  if(!name||amt<=0){toast('Select farmer and enter amount');return;}
  var rem=amt;
  db.sessions.forEach(function(s){
    if(s.farmer===name&&s.bal>0&&rem>0){
      var a=Math.min(s.bal,rem);
      s.paid=Math.round((s.paid+a)*100)/100; s.bal=Math.round((s.bal-a)*100)/100; rem=Math.round((rem-a)*100)/100;
    }
  });
  if(rem>0){var first=db.sessions.find(function(s){return s.farmer===name;});if(first){first.bal=Math.round((first.bal-rem)*100)/100;first.paid=Math.round((first.paid+rem)*100)/100;}}
  save(); toast('Payment recorded!');
  document.getElementById('p-amt').value='';
  renderFarmers(); renderDash();
});

// ── LEDGER ────────────────────────────────────────
function initLedger(){
  var lf=document.getElementById('l-farmer'), prev=lf.value;
  var names=[]; db.sessions.forEach(function(s){if(names.indexOf(s.farmer)===-1)names.push(s.farmer);});
  names.sort();
  lf.innerHTML='<option value="">-- Choose farmer --</option>'+names.map(function(n){return '<option value="'+n+'"'+(n===prev?' selected':'')+'>'+n+'</option>';}).join('');
  if(prev) renderLedger(prev);
}
document.getElementById('l-farmer').addEventListener('change',function(){renderLedger(this.value);});

function renderLedger(name){
  var el=document.getElementById('ledger-body');
  if(!name){el.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Select a farmer above</div>';return;}
  var ss=db.sessions.filter(function(s){return s.farmer===name;}).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!ss.length){el.innerHTML='<div class="empty">No sessions for this farmer</div>';return;}
  var tH=0,tB=0,tP=0,tBal=0;
  ss.forEach(function(s){tH+=s.hrs;tB+=s.bill;tP+=s.paid;tBal+=s.bal;});
  tH=Math.round(tH*10)/10; tB=Math.round(tB); tP=Math.round(tP); tBal=Math.round(tBal);
  el.innerHTML=
    '<div class="tbl-wrap"><table>'+
    '<thead><tr><th>Date</th><th>Time</th><th>Hrs</th><th>Bill</th><th>Paid</th><th>Bal</th></tr></thead>'+
    '<tbody>'+ss.map(function(s){
      return '<tr><td>'+s.date+'</td><td style="color:var(--text2)">'+s.start+'-'+s.end+'</td><td>'+Math.round(s.hrs*10)/10+'</td><td>'+rs(s.bill)+'</td><td style="color:var(--green)">'+rs(s.paid)+'</td><td><span class="badge '+(s.bal>0?'b-warn':'b-ok')+'">'+rs(s.bal)+'</span></td></tr>';
    }).join('')+
    '</tbody><tfoot><tr><td colspan="2">Total</td><td>'+tH+'</td><td>'+rs(tB)+'</td><td style="color:var(--green)">'+rs(tP)+'</td><td style="color:'+(tBal>0?'var(--warn)':'var(--green)')+'">'+rs(tBal)+'</td></tr></tfoot>'+
    '</table></div>'+
    '<div class="lsum">'+
    '<div class="lsi"><div class="lsi-l">Sessions</div><div class="lsi-v">'+ss.length+'</div></div>'+
    '<div class="lsi"><div class="lsi-l">Hours</div><div class="lsi-v">'+tH+'</div></div>'+
    '<div class="lsi"><div class="lsi-l">Billed</div><div class="lsi-v">'+rs(tB)+'</div></div>'+
    '<div class="lsi"><div class="lsi-l">Paid</div><div class="lsi-v" style="color:var(--green)">'+rs(tP)+'</div></div>'+
    '<div class="lsi"><div class="lsi-l">Balance</div><div class="lsi-v" style="color:'+(tBal>0?'var(--warn)':'var(--green)')+'">'+rs(tBal)+'</div></div>'+
    '</div>';
}

// ── RECEIPT ───────────────────────────────────────
function initReceipt(){
  var rf=document.getElementById('r-farmer');
  var names=[]; db.sessions.forEach(function(s){if(names.indexOf(s.farmer)===-1)names.push(s.farmer);});
  names.sort();
  rf.innerHTML='<option value="">Select farmer</option>'+names.map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('');
  document.getElementById('rcpt-out').innerHTML='';
  document.getElementById('btn-print').style.display='none';
}

document.getElementById('btn-rcpt').addEventListener('click', function(){
  var name=document.getElementById('r-farmer').value;
  var biz=document.getElementById('r-biz').value||'Borewell Farm Water Services';
  if(!name){toast('Select a farmer first');return;}
  var f=farmers().find(function(x){return x.name===name;});
  var ss=db.sessions.filter(function(s){return s.farmer===name;}).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  var today=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('rcpt-out').innerHTML=
    '<div class="rcpt" id="rcpt-print">'+
    '<div style="text-align:center;margin-bottom:14px"><div style="font-size:28px;margin-bottom:4px">💧</div><div style="font-size:15px;font-weight:700">'+biz+'</div><div style="font-size:11px;color:var(--text2);margin-top:3px">Water Usage Receipt</div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border)">'+
    '<div><div style="color:var(--text2)">Farmer</div><strong>'+name+'</strong></div>'+
    '<div style="text-align:right"><div style="color:var(--text2)">Date</div><strong>'+today+'</strong></div></div>'+
    '<div class="tbl-wrap"><table style="min-width:auto"><thead><tr><th>Date</th><th>Hrs</th><th>Bill</th><th>Paid</th></tr></thead><tbody>'+
    ss.map(function(s){return '<tr><td>'+s.date+'</td><td>'+Math.round(s.hrs*10)/10+'</td><td>'+rs(s.bill)+'</td><td style="color:var(--green)">'+rs(s.paid)+'</td></tr>';}).join('') +
    '</tbody></table></div>'+
    '<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">'+
    '<div class="rrow"><span style="color:var(--text2)">Total Billed</span><span>'+rs(f.bill)+'</span></div>'+
    '<div class="rrow"><span style="color:var(--text2)">Total Paid</span><span style="color:var(--green)">'+rs(f.paid)+'</span></div>'+
    '<div class="rrow rtot"><span>Balance</span><span style="color:'+(f.bal>0?'var(--warn)':'var(--green)')+'">'+rs(f.bal)+'</span></div></div>'+
    '<div style="text-align:center;font-size:11px;color:var(--text2);margin-top:12px">Thank you!</div>'+
    '</div>';
  document.getElementById('btn-print').style.display='flex';
  toast('Receipt ready!');
});

document.getElementById('btn-print').addEventListener('click', function(){
  var c=document.getElementById('rcpt-print');
  if(!c)return;
  var w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt</title><style>body{font-family:sans-serif;padding:20px;max-width:420px;margin:auto;color:#111}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}thead th{font-size:10px;text-transform:uppercase;color:#888}.rrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;font-size:13px}.rtot{font-weight:700;font-size:15px}hr{border:none;border-top:1px dashed #ccc;margin:10px 0}</style></head><body>'+c.innerHTML+'<br><button onclick="window.print()" style="width:100%;padding:10px;font-size:14px">Print</button></body></html>');
  w.document.close();
});

// ── TOAST ─────────────────────────────────────────
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';},2400);
}

// ── INIT ──────────────────────────────────────────
renderDash();
renderSessions();
</script>
</body>
</html>
